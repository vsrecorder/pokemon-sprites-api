services:
  pokemon-sprites-api:
    image: vsrecorder/pokemon-sprites-api:latest
    restart: unless-stopped
    #
    # メモリ上限。本番は単一VM(4vCPU/4GiB)に PostgreSQL・nginx・webapp・
    # 各APIサーバが同居しているため、上限が無いとリークを起こしたコンテナが
    # ホストのメモリを食い尽くし、カーネルのOOM Killerが巻き添えで
    # PostgreSQL を殺しうる。上限は暴走を1コンテナに閉じ込めるためのもので、
    # 平常時には当たらない値にしてある。
    #
    # memswap_limit を mem_limit と同値にしてスワップへの逃げを塞ぐ
    # (未指定だと docker は「メモリ+スワップ」を mem_limit の2倍まで許す)。
    #
    # network_mode: host と cgroup のメモリ制限は独立しているため、
    # ホストネットワークのままでもこの制限は効く。
    #
    # 64m の根拠: 2026-08-16 の本番実測(docker stats)で 6MiB。
    # スプライトのメタデータを返すだけのGo製APIで常駐量が小さいため、
    # 約10倍でもこの値になる。上限を実測から離しすぎると「暴走の隔離」として
    # 働かない(上限に達する前にホスト側が枯渇する)ため、意図的に低く抑えている。
    #
    # mem_reservation は実測値に合わせている。
    #
    mem_limit: 64m
    memswap_limit: 64m
    mem_reservation: 16m
    network_mode: "host"
    #
    # 応答できる状態になったかの判定。
    #
    # これが無いと `docker compose up --wait` は「コンテナが起動した」だけで完了し、
    # HTTP を受けられる前にデプロイが終わったことになる。
    #
    # distroless で shell もツールも無いため、test に書けるのはバイナリ自身だけ。
    # --health を渡すと、サーバは起動せず自分の /health を叩いて終了コードだけを返す。
    #
    healthcheck:
      test: ["CMD", "/pokemon-sprites-api", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    #
    # 注意: network_mode: host では、この ports は docker に無視される(公開の設定にならない)。
    # 待ち受けるアドレスはアプリ自身が決めており、cmd/main.go の listenHost(127.0.0.1)で
    # ループバックだけに絞っている(2026-10-31 の精査で、全インターフェースに開いていたのを直した)。
    # host ネットワークをやめる場合は、ここを "127.0.0.1:ポート:ポート" の形にし、アプリ側の待ち受けも見直すこと。
    #
    ports:
      - 8998:8998
    environment:
      - TZ=Asia/Tokyo
      - DB_HOSTNAME=${DB_HOSTNAME}
      - DB_PORT=${DB_PORT}
      - DB_USER_NAME=${DB_USER_NAME}
      - DB_USER_PASSWORD=${DB_USER_PASSWORD}
      - DB_NAME=${DB_NAME}
