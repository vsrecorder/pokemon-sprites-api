name: For Staging

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'master'

# GITHUB_TOKEN の権限は、リポジトリの取得(checkout)に要る読み取りだけにする。
# リポジトリの設定(Settings → Actions → Workflow permissions)が書き込み可に変わっても、
# ここで絞った権限が優先される。このワークフローは GitHub への書き込み(コメント・リリース・
# タグなど)をしないので、書き込みが要るステップを足すときは、そのジョブにだけ permissions を書き足すこと。
permissions:
  contents: read

jobs:
  build-and-push-container-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Container Image
        run: |
          DOCKER_BUILDKIT=1 \
          docker build . \
            --cache-from vsrecorder/pokemon-sprites-api:latest \
            --tag vsrecorder/pokemon-sprites-api:latest
      - name: Push Container Image
        run: |
          docker push vsrecorder/pokemon-sprites-api:latest

  notify-slack:
    if: ${{ always() }}
    needs:
      - build-and-push-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slack Notification
        run: |
          SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
          SUCCESS="${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" \
          WORKFLOW="${{ github.workflow }}" \
          SERVER_URL="${{ github.server_url }}" \
          REPOSITORY="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          SHA="${{ github.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          ACTOR="${{ github.actor }}" \
          /bin/bash ./.github/scripts/notify_slack.sh
