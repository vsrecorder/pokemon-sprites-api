name: For pull request to main branch

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'master'

# Dependabot が起こした実行には、通常の Actions のシークレットが渡されない(Dependabot 用の
# シークレットだけが渡される)。そのため Docker Hub へのログイン・push と Slack への通知ができず、
# ジョブが失敗していた。
# 更新された依存を含むコードの実行に Docker Hub の push 権限を渡したくないので、Dependabot の PR では
# イメージのビルドが通るかの確認だけを行い、ログイン・push と Slack への通知は行わない。
# 判定には実行を起こした人(github.actor)ではなく PR の作成者を使う。github.actor だと、人が
# Dependabot の PR で「Update branch」を押したときなどに、レビュー前の依存の更新を含むコードが
# push 権限付きで動いてしまうため。
jobs:
  build-and-push-container-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Container Registry
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Container Image
        run: |
          DOCKER_BUILDKIT=1 \
          docker build . \
            --cache-from vsrecorder/pokemon-sprites-api:develop \
            --tag vsrecorder/pokemon-sprites-api:develop
      - name: Push Container Image
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          docker push vsrecorder/pokemon-sprites-api:develop

  notify-slack:
    if: ${{ always() && github.event.pull_request.user.login != 'dependabot[bot]' }}
    needs:
      - build-and-push-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Slack Notification
        run: |
          SLACK_WEBHOOK_URL="${{ secrets.SLACK_WEBHOOK_URL }}" \
          SUCCESS="${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}" \
          WORKFLOW="${{ github.workflow }}" \
          SERVER_URL="${{ github.server_url }}" \
          REPOSITORY="${{ github.repository }}" \
          BRANCH="${{ github.ref_name }}" \
          SHA="${{ github.sha }}" \
          RUN_ID="${{ github.run_id }}" \
          ACTOR="${{ github.actor }}" \
          /bin/bash ./.github/scripts/notify_slack.sh
